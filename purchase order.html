<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบสั่งซื้อ (Purchase Order) - บริษัท เค แอล สเตชั่นเนอรี่ จำกัด</title>
    <!-- Google Fonts: Sarabun & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f766e;       /* ปรับโทนสีเป็น Teal เข้ม สุภาพสำหรับเอกสารจัดซื้อ */
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --secondary-color: #1e293b;
            --border-color: #cbd5e1;
            --bg-light: #f8fafc;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --shadow-subtle: 0 10px 30px -5px rgba(15, 118, 110, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --radius-box: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
            color: var(--secondary-color);
            margin: 0;
            padding: 30px 15px 60px 15px;
            font-size: 13px;
            line-height: 1.5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Toast Notification Styling */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-notification {
            background: #ffffff;
            color: var(--secondary-color);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            border-left: 5px solid var(--success-color);
            animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.3s ease 2.7s forwards;
            max-width: 350px;
        }

        .toast-notification.error {
            border-left-color: var(--danger-color);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Modern Sticky Toolbar */
        .modern-toolbar {
            position: sticky;
            top: 15px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            margin: 10px auto 25px auto;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 99px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.08);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .icon-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 15px -2px rgba(0, 0, 0, 0.15);
        }

        .icon-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            opacity: 0;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .icon-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .btn-home { background: rgba(74, 20, 140, 0.85); color: #ffffff; }
        .btn-add { background: rgba(233, 30, 99, 0.85); color: #ffffff; }
        .btn-clear { background: #f59e0b; color: #ffffff; }
        .btn-print { background: rgba(15, 118, 110, 0.9); color: #ffffff; }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover { filter: brightness(1.1); }

        /* Container & Page Layout */
        .page-sheet {
            max-width: 900px;
            margin: 0 auto 35px auto;
            background: #ffffff;
            padding: 40px;
            box-shadow: var(--shadow-subtle);
            border-radius: var(--radius-box);
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Header Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 18px;
        }

        .header-left {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .logo-container img {
            width: 75px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .shop-info-box .company-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .shop-info-box .address-text {
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
        }

        .title-box {
            text-align: right;
        }

        .title-main {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .title-sub {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* Top Info Grid */
        .top-info {
            width: 100%;
            margin-bottom: 18px;
            border-collapse: collapse;
        }

        .top-info td {
            vertical-align: top;
            padding: 4px;
        }

        .top-info td:first-child { width: 58%; }
        .top-info td:last-child { width: 42%; }

        .vendor-info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 12px;
        }

        .po-meta-box {
            background-color: var(--primary-light);
            border: 1px solid #99f6e4;
            padding: 12px 14px;
            border-radius: 12px;
        }

        .info-row {
            margin-bottom: 5px;
            display: flex;
            align-items: baseline;
        }
        .info-row:last-child { margin-bottom: 0; }

        .info-label {
            font-weight: 600;
            color: #475569;
            min-width: 115px;
            font-size: 11.5px;
        }

        .inline-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            outline: none;
            font-family: inherit;
            font-size: inherit;
            padding: 2px 6px;
            color: var(--secondary-color);
            background: transparent;
            transition: all 0.25s ease;
        }

        .inline-input:focus {
            border-bottom: 1.5px solid var(--primary-color);
            background-color: #fff;
            border-radius: 4px;
        }

        .inline-textarea {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            padding: 3px 6px;
            resize: none;
            width: 100%;
            background: #fff;
            min-height: 26px;
            height: auto;
            overflow-y: hidden;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            white-space: pre-wrap !important;
        }

        /* Delivery Box (สถานที่จัดส่งสำหรับใบสั่งซื้อ) */
        .delivery-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        /* Table Styling */
        .table-responsive-wrapper {
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            vertical-align: middle !important;
        }

        .data-table th {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #334155;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
        }

        .item-desc {
            display: block;
            width: 100%;
            min-height: 22px;
            height: 22px;
            box-sizing: border-box;
            border: none;
            outline: none;
            resize: none;
            margin: 0;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: 1.4;
            background: transparent;
            overflow: hidden;
            white-space: pre-wrap !important;
            overflow-wrap: anywhere !important;
        }

        .sku-input, .qty, .price, .unit-input {
            width: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
        }

        .qty, .price { text-align: right !important; }
        .sku-input, .unit-input { text-align: center !important; }

        .btn-del {
            background-color: #fee2e2;
            color: var(--danger-color);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-del:hover {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-del:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Footer & Summary Table */
        .footer-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .footer-table td {
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            font-size: 12px;
        }

        .footer-total-label {
            background-color: var(--bg-light);
            font-weight: 600;
            color: #475569;
            width: 25%;
            white-space: nowrap;
        }

        /* Signature Section (3 ช่องสำหรับใบสั่งซื้อ: ผู้จัดทำ / ผู้ตรวจสอบ / ผู้อนุมัติสั่งซื้อ) */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 15px;
            page-break-inside: avoid;
        }

        .sig-box {
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            border-radius: 12px;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* พื้นที่แสดงรูปภาพลายเซ็นและปุ่มอัปโหลด */
        .sig-pad-area {
            width: 100%;
            height: 62px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            margin-bottom: 4px;
        }

        .sig-preview-img {
            max-height: 58px;
            max-width: 170px;
            object-fit: contain;
            display: block;
        }

        .btn-upload-sig {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
        }

        .btn-upload-sig:hover {
            background: var(--primary-light);
        }

        .btn-remove-sig {
            position: absolute;
            top: 0;
            right: 4px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .btn-remove-sig:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .sig-line {
            width: 85%;
            border-bottom: 1.5px dotted #94a3b8;
            margin: 0 auto 8px auto;
        }

        .sig-name-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 90%;
            outline: none;
            font-family: inherit;
            margin-bottom: 4px;
            font-size: 12px;
            background: transparent;
        }

        .sig-text {
            font-size: 11.5px;
            color: #334155;
            font-weight: 700;
        }

        .sig-date {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .sig-date-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 95px;
            outline: none;
            font-family: inherit;
            background: transparent;
        }

        #print-pages-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .add-row-floating-wrap { position:sticky; bottom:14px; z-index:900; display:flex; justify-content:flex-end; margin:10px 0 18px; pointer-events:none; }
        .add-row-floating { pointer-events:auto; display:inline-flex; align-items:center; gap:8px; border:0; border-radius:999px; padding:11px 19px; color:#fff; background:linear-gradient(135deg,#e91e63,#be185d); box-shadow:0 8px 22px rgba(190,24,93,.28); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
        .add-row-floating:hover { transform:translateY(-2px); filter:brightness(1.05); }
        .po-load-modal { position:fixed; inset:0; z-index:10000; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,.55); }
        .po-load-modal.show { display:flex; }
        .po-load-panel { width:min(620px,100%); max-height:80vh; overflow:auto; background:#fff; border-radius:16px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
        .po-saved-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #e2e8f0; }
        .po-saved-row .actions { display: flex; gap: 8px; align-items: center; }
        .po-saved-row button { border:0; border-radius:8px; padding:7px 12px; background:#0f766e; color:#fff; cursor:pointer; font-family:inherit; }
        .po-saved-row button.btn-danger-row { background:#ef4444; }

        /* Print Settings */
        @media print {
            @page {
                size: A4;
                margin: 5mm;
            }
            body {
                background-color: #ffffff;
                padding: 0;
                font-size: 11px;
                line-height: 1.3;
            }
            .modern-toolbar, .no-print, #toast-container, .add-row-floating-wrap, .po-load-modal, .btn-upload-sig, .btn-remove-sig {
                display: none !important;
            }
            .page-sheet {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 auto !important;
                padding: 8px 14px !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                border: none !important;
                page-break-after: always;
            }
            .header-section {
                padding-bottom: 4px;
                margin-bottom: 6px;
            }
            .logo-container img { width: 55px !important; }
            .shop-info-box .company-name { font-size: 13px; }
            .shop-info-box .address-text { font-size: 10px; }
            .title-main { font-size: 18px; }
            .top-info { margin-bottom: 6px; }
            .vendor-info-box, .po-meta-box { padding: 6px 8px !important; border-radius: 8px; }
            .delivery-box { padding: 5px 8px !important; margin-bottom: 6px; border-radius: 6px; }
            .info-row { margin-bottom: 3px; }
            .inline-textarea {
                border: none !important;
                padding: 1px 4px !important;
                height: auto !important;
            }
            .data-table th, .data-table td {
                padding: 2px 5px !important;
                font-size: 11px;
            }
            .footer-table { margin-bottom: 6px; }
            .footer-table td { padding: 2px 6px !important; font-size: 11px; }
            .signature-section { margin-top: 8px !important; gap: 10px; }
            .sig-box { padding: 6px 6px !important; border-radius: 8px; }
            .sig-pad-area { height: 44px; }
            .sig-preview-img { max-height: 42px; }
            .sig-line { margin: 0 auto 4px auto !important; }
            .sig-name-input, .sig-date-input { border: none !important; }
            input::placeholder, textarea::placeholder {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
            }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>
<div id="po-load-modal" class="po-load-modal no-print" role="dialog" aria-modal="true" aria-labelledby="po-load-title">
  <div class="po-load-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;">
      <h3 id="po-load-title" style="margin:0;color:#115e59;font-size:17px;">📂 ใบสั่งซื้อที่บันทึกออนไลน์</h3>
      <button type="button" onclick="closeSavedPurchaseOrders()" style="border:0;background:#f1f5f9;border-radius:8px;padding:7px 11px;cursor:pointer;">ปิด ✕</button>
    </div>
    <div id="po-saved-list"><div style="padding:18px;text-align:center;color:#64748b;">กำลังโหลดข้อมูล...</div></div>
  </div>
</div>

<!-- แถบเครื่องมือด้านบน -->
<div class="modern-toolbar no-print">
  <div class="toolbar-group">
    <a href="index.html" class="icon-btn btn-home" data-tooltip="หน้าแรก">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
    </a>
  </div>
  
  <div class="toolbar-group">
    <button class="icon-btn btn-add" onclick="savePurchaseOrderOnline()" data-tooltip="บันทึกใบสั่งซื้อออนไลน์" aria-label="บันทึกใบสั่งซื้อออนไลน์">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 4.5h12l2.5 2.5v12.5H4.5v-15H5Z M8 4.5v5h8v-5 M8 19.5v-6h8v6" /></svg>
    </button>
    <button class="icon-btn" style="background:#7c3aed;color:#fff;" onclick="savePurchaseOrderOnline(true)" data-tooltip="Save New - บันทึกเป็นใบสั่งซื้อใหม่" aria-label="Save New">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14" /></svg>
    </button>
    <button class="icon-btn" style="background:#2563eb;color:#fff;" onclick="openSavedPurchaseOrders()" data-tooltip="เรียกดู / แก้ไขใบสั่งซื้อที่บันทึกไว้" aria-label="เรียกดูใบสั่งซื้อ">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5h16M4 12h16M4 18.5h16" /></svg>
    </button>
    <button class="icon-btn btn-clear" onclick="clearPurchaseOrder(true)" data-tooltip="เคลียร์รายการทั้งหมด" aria-label="เคลียร์รายการ">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
    </button>
    
    <button class="icon-btn btn-print" onclick="window.print()" data-tooltip="พิมพ์ / บันทึก PDF">

    function handleSignatureUpload(field, inputEl) {
        const file = inputEl.files && inputEl.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showToast("กรุณาเลือกไฟล์รูปภาพเท่านั้น (PNG, JPG, WebP)", true);
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxWidth = 360;
                const maxHeight = 140;
                let width = img.width;
                let height = img.height;

                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                // แปลงเป็น PNG เพื่อคงความโปร่งใสของพื้นหลังลายเซ็น
                const compressedBase64 = canvas.toDataURL('image/png');
                docMeta[field] = compressedBase64;
                renderDocument();
                showToast("อัปโหลดรูปภาพลายเซ็นเรียบร้อยแล้ว");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ฟังก์ชันคำนวณยอดเงินทั้งหมดตามรูปแบบต้นฉบับ
    function calculateTotals() {
        let subTotal = 0;

        itemsData.forEach((item) => {
            const qty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;
            const price = parseFloat(String(item.price).replace(/,/g, '')) || 0;
            subTotal += (qty * price);
        });

        let discountRate = parseFloat(docMeta.discountRate);
        let discountAmount = 0;

        if (isNaN(discountRate) || discountRate <= 0) {
            discountRate = 0;
            discountAmount = 0;
        } else {
            discountAmount = (subTotal * discountRate) / 100;
        }

        let netTotal = subTotal - discountAmount;
        if (netTotal < 0) netTotal = 0;

        let vatAmount = (docMeta.vatType === 'none') ? 0 : (netTotal * 0.07);
        let grandTotal = netTotal + vatAmount;
        let thaiTextStr = arabicToThaiText(grandTotal);

        const pageSheets = document.querySelectorAll(".page-sheet");
        const totalPages = pageSheets.length;

        pageSheets.forEach((sheet) => {
            const isLast = sheet.getAttribute("data-is-last") === "true";

            const displaySubTotal = (totalPages === 1 || isLast) ? subTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayDiscount = (totalPages === 1 || isLast) ? discountAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayNetTotal = (totalPages === 1 || isLast) ? netTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayVat      = (totalPages === 1 || isLast) ? vatAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayGrand    = (totalPages === 1 || isLast) ? grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayThaiText = (totalPages === 1 || isLast) ? thaiTextStr : "ศูนย์บาทถ้วน";

            const subTotalEl = sheet.querySelector(".subTotal");
            const discountRateEl = sheet.querySelector(".discountRate");
            const discountAmountEl = sheet.querySelector(".discountAmount");
            const netTotalEl = sheet.querySelector(".netTotal");
            const vatAmountEl = sheet.querySelector(".vatAmount");
            const grandTotalEl = sheet.querySelector(".grandTotal");
            const textAmountEl = sheet.querySelector(".textAmount");

            if (subTotalEl) subTotalEl.textContent = displaySubTotal;
            if (discountRateEl) discountRateEl.value = discountRate;
            if (discountAmountEl) discountAmountEl.value = displayDiscount;
            if (netTotalEl) netTotalEl.textContent = displayNetTotal;
            if (vatAmountEl) vatAmountEl.textContent = displayVat;
            if (grandTotalEl) grandTotalEl.textContent = displayGrand;
            if (textAmountEl) textAmountEl.textContent = displayThaiText;
        });

        // อัปเดตยอดรวมรายบรรทัด
        document.querySelectorAll(".item-row").forEach((row) => {
            const idx = parseInt(row.getAttribute("data-item-index"), 10);
            if (!isNaN(idx) && itemsData[idx]) {
                const q = parseFloat(String(itemsData[idx].qty).replace(/,/g, '')) || 0;
                const p = parseFloat(String(itemsData[idx].price).replace(/,/g, '')) || 0;
                const amtCell = row.querySelector(".amount");
                if (amtCell) {
                    amtCell.textContent = (q * p).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            }
        });
    }

    // แปลงตัวเลขเป็นคำอ่านภาษาไทย (รองรับหลักล้านขึ้นไป)
    function arabicToThaiText(amount) {
        if (!amount || amount === 0) return "ศูนย์บาทถ้วน";
        const arabicNumber = amount.toFixed(2);
        const splitNum = arabicNumber.split(".");
        let integerPart = splitNum[0];
        let decimalPart = splitNum[1];

        let thaiText = convertIntegerToThai(integerPart) + "บาท";
        if (decimalPart === "00") {
            thaiText += "ถ้วน";
        } else {
            thaiText += convertIntegerToThai(decimalPart) + "สตางค์";
        }
        return thaiText;
    }

    function convertIntegerToThai(numStr) {
        const thaiNums = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
        const thaiUnits = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];
        let result = "";
        let len = numStr.length;

        for (let i = 0; i < len; i++) {
            let digit = parseInt(numStr[i], 10);
            let pos = len - i - 1;
            let unitIndex = pos % 6;

            if (digit !== 0) {
                if (unitIndex === 1 && digit === 1) {
                    result += "สิบ";
                } else if (unitIndex === 1 && digit === 2) {
                    result += "ยี่สิบ";
                } else if (unitIndex === 0 && digit === 1 && len > 1 && parseInt(numStr[len - 2], 10) !== 0) {
                    result += "เอ็ด";
                } else {
                    result += thaiNums[digit] + thaiUnits[unitIndex];
                }
            }
            if (pos > 0 && unitIndex === 0) {
                result += "ล้าน";
            }
        }
        return result;
    }

    async function savePurchaseOrderOnline(saveAsNew = false) {
        if (poSaving) return;
        if (!poCurrentUser) { showToast("กรุณาเข้าสู่ระบบจากหน้า CRM ก่อนบันทึกออนไลน์", true); return; }
        const validItems = getValidPurchaseOrderItems();
        if (!validItems.length) {
            showToast("ไม่สามารถบันทึกได้ เนื่องจากยังไม่มีรายการสินค้า กรุณาเพิ่มชื่อสินค้าหรือรายละเอียดอย่างน้อย 1 รายการ", true);
            return;
        }

        try {
            poSaving = true;
            let poNo = String(docMeta.poNo || '').trim();

            // สุ่มเลข PO ใหม่เมื่อกดบันทึกเป็นบิลใหม่ (Save New) หรือสร้างใหม่
            if (saveAsNew || !poCurrentRecordId || !poNo || poNo === autoPoNo) {
                poNo = generateRandomPoNo();
                docMeta.poNo = poNo;
                document.querySelectorAll('.meta-field[data-field="poNo"]').forEach(el => { el.value = poNo; });
            }

            let docId;
            if (saveAsNew) {
                docId = `${poCurrentUser.uid}_new_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            } else if (poCurrentRecordId) {
                docId = poCurrentRecordId;
            } else {
                docId = getPurchaseOrderDocId(poNo, poCurrentUser.uid);
            }
            const payload = {
                poNo, ownerUid: poCurrentUser.uid,
                docMeta: JSON.parse(JSON.stringify(docMeta)),
                itemsData: JSON.parse(JSON.stringify(validItems)),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAtClient: new Date().toISOString()
            };
            if (saveAsNew) {
                await poDb.collection('purchaseOrders').doc(docId).set({
                    ...payload,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtClient: new Date().toISOString()
                });
                showToast(`Save New: สร้างใบสั่งซื้อ ${poNo} เป็นเอกสารใหม่เรียบร้อยแล้ว (ไม่ทับบิลเดิม)`);
            } else {
                await poDb.collection('purchaseOrders').doc(docId).set(payload, { merge: true });
                showToast(`บันทึกใบสั่งซื้อ ${poNo} ออนไลน์เรียบร้อยแล้ว`);
            }
            poCurrentRecordId = docId;
            itemsData = validItems;
            renderDocument();
        } catch (error) {
            console.error('Purchase Order online save failed:', error);
            showToast("บันทึกออนไลน์ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อหรือสิทธิ์ Firestore", true);
        } finally { poSaving = false; }
    }

    async function openSavedPurchaseOrders() {
        const modal = document.getElementById('po-load-modal');
        const list = document.getElementById('po-saved-list');
        modal.classList.add('show');
        list.textContent = 'กำลังโหลดข้อมูลจาก Firebase...';
        if (!poCurrentUser) { list.textContent = 'กรุณาเข้าสู่ระบบจากหน้า CRM ก่อนเรียกดูใบสั่งซื้อ'; return; }
        try {
            const snapshot = await poDb.collection('purchaseOrders').where('ownerUid', '==', poCurrentUser.uid).get();
            const records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            records.sort((a,b) => String(b.updatedAtClient || '').localeCompare(String(a.updatedAtClient || '')));
            list.innerHTML = '';
            if (!records.length) { list.textContent = 'ยังไม่มีใบสั่งซื้อที่บันทึกไว้'; return; }
            records.forEach(record => {
                const row = document.createElement('div'); row.className = 'po-saved-row';
                const info = document.createElement('div');
                const name = document.createElement('strong'); name.textContent = record.poNo || '(ไม่มีเลขที่ PO)';
                const detail = document.createElement('div'); detail.style.cssText = 'font-size:11px;color:#64748b;margin-top:3px;';
                detail.textContent = `ผู้ขาย: ${(record.docMeta && record.docMeta.vendorName) || '-'} · ${(record.itemsData || []).length} รายการ`;
                info.append(name, detail);
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';
                
                const btnOpen = document.createElement('button'); btnOpen.type = 'button'; btnOpen.textContent = 'เปิดแก้ไข';
                btnOpen.addEventListener('click', () => loadPurchaseOrderRecord(record));
                
                // เพิ่มปุ่มลบรายการออนไลน์ในหน้าต่างจัดการใบสั่งซื้อ
                const btnDelete = document.createElement('button'); btnDelete.type = 'button'; btnDelete.className = 'btn-danger-row'; btnDelete.textContent = 'ลบ';
                btnDelete.addEventListener('click', () => deletePurchaseOrderRecord(record.id, record.poNo));
                
                actionsDiv.append(btnOpen, btnDelete);
                row.append(info, actionsDiv); 
                list.appendChild(row);
            });
        } catch (error) {
            console.error('Purchase Order online load failed:', error);
            list.textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบสิทธิ์ Firestore และการเชื่อมต่อ';
        }
    }

    async function deletePurchaseOrderRecord(docId, poNo) {
        if (!confirm(`คุณต้องการลบใบสั่งซื้อเลขที่ "${poNo || docId}" จากระบบออนไลน์ใช่หรือไม่?`)) return;
        try {
            await poDb.collection('purchaseOrders').doc(docId).delete();
            showToast(`ลบใบสั่งซื้อ ${poNo || ''} สำเร็จ`);
            openSavedPurchaseOrders(); // รีเฟรชรายการในโมดอล
        } catch (error) {
            console.error('Delete online purchase order failed:', error);
            showToast('ลบรายการไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', true);
        }
    }

    function loadPurchaseOrderRecord(record) {
        if (!record || !record.docMeta || !Array.isArray(record.itemsData)) { showToast('รูปแบบข้อมูลใบสั่งซื้อไม่ถูกต้อง', true); return; }
        if (!confirm(`ต้องการเปิดใบสั่งซื้อ ${record.poNo || ''} เพื่อแก้ไขหรือไม่? ข้อมูลบนหน้าปัจจุบันจะถูกแทนที่`)) return;
        poCurrentRecordId = record.id;
        docMeta = { ...docMeta, ...record.docMeta };
        itemsData = record.itemsData.map(item => ({ desc:'', model:'', qty:1, unit:'', price:0, ...item }));
        closeSavedPurchaseOrders();
        renderDocument();
        showToast(`เปิดใบสั่งซื้อ ${record.poNo || ''} เรียบร้อยแล้ว สามารถแก้ไขและบันทึกทับ หรือกด Save New เพื่อสร้างบิลใหม่ได้`);
    }

    // โหลดรายชื่อผู้ขาย (Vendor) จาก localStorage (ถ้ามีเก็บไว้ในระบบ)
    let allVendorsData = [];
    function loadVendorDropdown() {
        const localVendors = JSON.parse(localStorage.getItem('saved_po_vendors') || localStorage.getItem('saved_quot_customers') || '[]');
        allVendorsData = localVendors;
        document.querySelectorAll('.vendorSelect').forEach(select => {
            select.innerHTML = '<option value="">-- เลือกผู้ขาย / ซัพพลายเออร์ --</option>';
            localVendors.forEach(v => {
                const name = typeof v === 'string' ? v : (v.name || v.vendorName || v.companyName || '');
                if (name) {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                }
            });
        });
    }

    function selectVendor(selectEl) {
        const selectedName = selectEl.value;
        const found = allVendorsData.find(v => {
            const name = typeof v === 'string' ? v : (v.name || v.vendorName || v.companyName || '');
            return name === selectedName;
        });

        if (found && typeof found === 'object') {
            docMeta.vendorName = found.name || found.vendorName || found.companyName || selectedName;
            docMeta.vendorAddress = found.address || found.vendorAddress || '';
            docMeta.vendorTaxNo = found.taxNo || found.tax || '';
            docMeta.vendorContact = found.contact || '';
            docMeta.vendorTel = found.tel || found.phone || '';
        } else {
            docMeta.vendorName = selectedName;
        }
        renderDocument();
    }

    // ดึงรายการสินค้าจากเลขที่ใบเสนอราคา (Quotation) ใน localStorage มาออกใบสั่งซื้อ
    function importFromQuotation(btnEl) {
        const box = btnEl.closest('.po-meta-box');
        const qNo = (box?.querySelector('.searchQuotationInput')?.value || '').trim();
        if (!qNo) {
            showToast("กรุณากรอกเลขที่ใบเสนอราคาที่ต้องการดึงข้อมูล", true);
            return;
        }

        let savedBills = [];
        try { savedBills = savedBills.concat(JSON.parse(localStorage.getItem('saved_quotations') || '[]')); } catch(e){}
        try { savedBills = savedBills.concat(JSON.parse(localStorage.getItem('saved_quot_purchases') || '[]')); } catch(e){}

        const found = savedBills.find(b => String(b.billNo || b.quotationNo || '').trim() === qNo);
        if (found) {
            docMeta.refQuotationNo = qNo;
            docMeta.discountRate = found.discountRate || found.discount || 0;
            const rawItems = found.items || found.itemsData || [];
            if (rawItems.length > 0) {
                itemsData = rawItems.map(item => ({
                    desc: item.desc || item.name || "",
                    model: item.model || "",
                    qty: Number(item.qty) || 1,
                    unit: item.unit || "",
                    price: Number(item.price || item.unitPrice) || 0
                }));
            }
            renderDocument();
            showToast(`นำเข้ารายการจากใบเสนอราคา ${qNo} เรียบร้อยแล้ว`);
        } else {
            showToast(`ไม่พบข้อมูลใบเสนอราคาเลขที่ ${qNo}`, true);
        }
    }

    // ปรับความสูง Textarea อัตโนมัติ
    function adjustTextareaHeight(ta) {
        if (!ta) return;
        ta.style.height = '22px';
        ta.style.height = Math.max(22, ta.scrollHeight) + 'px';
    }

    function adjustAllTextareas() {
        requestAnimationFrame(() => {
            document.querySelectorAll('textarea.item-desc, textarea.inline-textarea').forEach(adjustTextareaHeight);
        });
    }

    document.addEventListener('input', function(e) {
        if (e.target && e.target.matches('textarea')) {
            adjustTextareaHeight(e.target);
        }
    });

    window.addEventListener('resize', adjustAllTextareas);
    window.addEventListener('beforeprint', adjustAllTextareas);

    // ก่อนพิมพ์ ซ่อนแถวสินค้าที่ว่างและเรียงเลขลำดับใหม่
    let poPrintRowState = [];
    window.addEventListener('beforeprint', function() {
        poPrintRowState = [];
        document.querySelectorAll('.page-sheet').forEach(sheet => {
            const wrapper = sheet.querySelector('.table-responsive-wrapper');
            const rows = Array.from(sheet.querySelectorAll('tbody .item-row'));
            let visibleCount = 0;
            rows.forEach(row => {
                const desc = (row.querySelector('.item-desc')?.value || '').trim();
                const model = (row.querySelector('.sku-input')?.value || '').trim();
                const unit = (row.querySelector('.unit-input')?.value || '').trim();
                const filled = !!(desc || model || unit);
                poPrintRowState.push({ row, display: row.style.display, number: row.cells[0]?.textContent });
                if (!filled) row.style.display = 'none';
                else {
                    visibleCount++;
                    if (row.cells[0]) row.cells[0].textContent = String(visibleCount);
                }
            });
            if (wrapper && visibleCount === 0) {
                wrapper.dataset.poWasEmpty = 'true';
                wrapper.style.display = 'none';
            }
        });
    });
    window.addEventListener('afterprint', function() {
        poPrintRowState.forEach(state => {
            state.row.style.display = state.display;
            if (state.row.cells[0]) state.row.cells[0].textContent = state.number;
        });
        document.querySelectorAll('.table-responsive-wrapper[data-po-was-empty="true"]').forEach(wrapper => {
            wrapper.style.display = '';
            delete wrapper.dataset.poWasEmpty;
        });
        poPrintRowState = [];
        // เคลียร์รายการและสุ่มเลข PO ใหม่หลังพิมพ์สำเร็จเพื่อเริ่มการสั่งซื้อครั้งใหม่
        clearPurchaseOrder(false);
    });


    window.onload = function() {
        renderDocument();
    };
</script>

</body>
</html>
