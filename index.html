<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คการจัดส่งสินค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f0f4f8] text-slate-800 min-h-screen pb-12 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                📦 <span class="bg-gradient-to-r from-sky-600 to-blue-600 bg-clip-text text-transparent">Delivery Tracking</span>
            </h1>
            <span id="connection-status" class="text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-700 font-medium">กำลังเชื่อมต่อ Firebase...</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6 w-full flex-grow">
        
        <!-- ฟอร์มเพิ่มข้อมูล (ซ้าย) -->
        <section class="md:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-sky-100 h-fit">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">➕ เพิ่มรายการค้างส่ง</h2>
            <form id="delivery-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อลูกค้า <span class="text-red-500">*</span></label>
                    <input type="text" id="customer-name" required placeholder="เช่น คุณสมชาย" class="w-full px-3 py-2 text-sm border border-sky-100 bg-sky-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อบริษัท</label>
                    <input type="text" id="company-name" placeholder="เช่น บริษัท เอ็กซ์วายซี จำกัด" class="w-full px-3 py-2 text-sm border border-sky-100 bg-sky-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" placeholder="0812345678" class="w-full px-3 py-2 text-sm border border-sky-100 bg-sky-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">รายการสินค้าที่ค้างส่ง <span class="text-red-500">*</span></label>
                    <textarea id="items" rows="3" required placeholder="เช่น กล่องควบคุม 2 ชุด" class="w-full px-3 py-2 text-sm border border-sky-100 bg-sky-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition"></textarea>
                    <p class="text-[11px] text-slate-400 mt-1">* หากลูกค้ามีชื่ออยู่แล้ว ระบบจะนำรายการนี้ไปรวมกับของเดิมให้อัตโนมัติ</p>
                </div>
                <button type="submit" id="submit-btn" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-sm transition shadow-md shadow-sky-200 flex items-center justify-center gap-2">
                    <span>บันทึกข้อมูล</span>
                </button>
            </form>
        </section>

        <!-- รายการจัดส่ง (ขวา) -->
        <section class="md:col-span-2 space-y-4">
            <!-- ค้นหา -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-sky-100 flex items-center gap-2">
                <span class="text-sky-400 pl-2">🔍</span>
                <input type="text" id="search-input" placeholder="ค้นหาชื่อลูกค้า, บริษัท หรือรายการสินค้า..." class="w-full text-sm outline-none bg-transparent placeholder-slate-400">
            </div>

            <!-- รายการ Cards -->
            <div id="delivery-list" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-sm animate-pulse">กำลังโหลดข้อมูล...</div>
            </div>
        </section>
    </main>

    <!-- Modern Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modern Modal Confirmation Dialog -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-100 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="text-3xl mb-3">⚠️</div>
            <h3 id="modal-title" class="text-base font-bold text-slate-800 mb-2">ยืนยันการทำรายการ</h3>
            <p id="modal-desc" class="text-xs text-slate-500 mb-6 leading-relaxed">คุณต้องการดำเนินการนี้ใช่หรือไม่?</p>
            <div class="flex gap-3">
                <button id="modal-cancel" class="flex-1 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 transition">ยกเลิก</button>
                <button id="modal-confirm" class="flex-1 py-2 rounded-xl text-xs font-semibold bg-red-500 hover:bg-red-600 text-white shadow-sm transition">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-sky-100 mt-12">
        Delivery Tracking System © 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBAQ347hnwb3a30u0ckyHK1QWV9eUEMiWE",
            authDomain: "delivery-tracking-2313a.firebaseapp.com",
            projectId: "delivery-tracking-2313a",
            storageBucket: "delivery-tracking-2313a.firebasestorage.app",
            messagingSenderId: "631670801383",
            appId: "1:631670801383:web:e720570af97bad7011f342",
            measurementId: "G-BB2D5DJH3F"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const statusBadge = document.getElementById('connection-status');
        statusBadge.textContent = 'เชื่อมต่อ Server แล้ว';
        statusBadge.className = 'text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColors = {
                success: 'bg-slate-900 text-white border-slate-800',
                error: 'bg-red-600 text-white border-red-500',
                info: 'bg-sky-600 text-white border-sky-500'
            };

            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };

            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl text-xs shadow-xl border transition-all duration-300 translate-y-4 opacity-0 ${bgColors[type] || bgColors.success}`;
            toast.innerHTML = `<span>${icons[type] || ''}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirmModal(title, desc, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const modalContent = document.getElementById('modal-content');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const btnConfirm = document.getElementById('modal-confirm');
            const btnCancel = document.getElementById('modal-cancel');

            titleEl.textContent = title;
            descEl.textContent = desc;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);

            const closeModal = () => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
                btnConfirm.replaceWith(btnConfirm.cloneNode(true));
                btnCancel.replaceWith(btnCancel.cloneNode(true));
            };

            document.getElementById('modal-confirm').addEventListener('click', () => {
                closeModal();
                onConfirm();
            }, { once: true });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                closeModal();
            }, { once: true });
        }

        const deliveryForm = document.getElementById('delivery-form');
        const submitBtn = document.getElementById('submit-btn');

        deliveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customerName = document.getElementById('customer-name').value.trim();
            const companyName = document.getElementById('company-name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const newItemText = document.getElementById('items').value.trim();

            if (!customerName || !newItemText) {
                showToast('กรุณากรอกข้อมูลชื่อลูกค้าและรายการสินค้าให้ครบถ้วน', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังบันทึก...`;

            try {
                const snapshot = await db.collection('deliveries')
                    .where('customerName', '==', customerName)
                    .get();

                const subItemObj = {
                    id: 'sub_' + Math.random().toString(36).substring(2, 9),
                    text: newItemText,
                    createdAt: new Date().toISOString()
                };

                if (!snapshot.empty) {
                    const docRef = snapshot.docs[0].ref;
                    const docData = snapshot.docs[0].data();
                    const existingItems = docData.subItems || [];
                    
                    if (existingItems.length === 0 && docData.items) {
                        existingItems.push({
                            id: 'sub_old',
                            text: docData.items,
                            createdAt: docData.createdAt ? (docData.createdAt.toDate ? docData.createdAt.toDate().toISOString() : new Date().toISOString()) : new Date().toISOString()
                        });
                    }

                    existingItems.push(subItemObj);

                    await docRef.update({
                        subItems: existingItems,
                        companyName: companyName || docData.companyName || '',
                        phone: phone || docData.phone || ''
                    });

                    showToast(`เพิ่มรายการสินค้าให้ "${customerName}" เรียบร้อย`, 'success');
                } else {
                    const data = {
                        customerName,
                        companyName,
                        phone,
                        subItems: [subItemObj],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('deliveries').add(data);
                    showToast('บันทึกข้อมูลสำเร็จเรียบร้อย', 'success');
                }

                deliveryForm.reset();
            } catch (err) {
                console.error(err);
                showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>บันทึกข้อมูล</span>';
            }
        });

        let allDeliveries = [];
        db.collection('deliveries').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            allDeliveries = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                let itemsList = data.subItems || [];
                if (itemsList.length === 0 && data.items) {
                    itemsList = [{ id: 'legacy', text: data.items }];
                }
                allDeliveries.push({ id: doc.id, ...data, subItems: itemsList });
            });
            renderList(allDeliveries);
        }, error => {
            console.error(error);
            document.getElementById('delivery-list').innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl text-center text-sm border border-red-100">เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบสิทธิ์ Firebase Security Rules</div>`;
            showToast('ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
        });

        function renderList(data) {
            const container = document.getElementById('delivery-list');
            if (data.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-sky-100 text-center text-slate-400 text-sm shadow-sm">ไม่มีรายการจัดส่งค้างอยู่ในระบบขณะนี้</div>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-sky-100 space-y-3 transition hover:shadow-md hover:border-sky-200">
                    <div class="flex items-start justify-between gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-slate-800 text-base">${escapeHTML(item.customerName)}</span>
                                ${item.companyName ? `<span class="text-xs bg-sky-50 text-sky-700 px-2.5 py-0.5 rounded-md font-medium border border-sky-100">${escapeHTML(item.companyName)}</span>` : ''}
                            </div>
                            ${item.phone ? `<div class="text-xs text-sky-600 font-medium">📞 <a href="tel:${escapeHTML(item.phone)}" class="hover:underline">${escapeHTML(item.phone)}</a></div>` : ''}
                        </div>
                        <button onclick="deleteEntireCustomer('${item.id}', '${escapeHTML(item.customerName)}')" title="ลบรายการทั้งหมดของลูกค้านี้" class="text-xs text-slate-400 hover:text-red-500 transition px-2 py-1 rounded-lg hover:bg-red-50">ลบทั้งหมด</button>
                    </div>

                    <div class="space-y-2 pt-1 border-t border-slate-100">
                        <div class="text-xs font-semibold text-slate-500 mb-1">รายการค้างส่ง:</div>
                        ${item.subItems.map(sub => `
                            <div class="flex items-center justify-between gap-3 bg-sky-50/50 p-2.5 rounded-xl border border-sky-100/60 text-xs text-slate-700">
                                <span class="flex-grow">• ${escapeHTML(sub.text)}</span>
                                <button onclick="completeSubItem('${item.id}', '${sub.id}', '${escapeHTML(item.customerName)}', '${escapeHTML(sub.text)}')" title="จัดส่งรายการนี้แล้ว" class="flex-shrink-0 w-8 h-8 rounded-lg bg-white hover:bg-emerald-500 text-sky-600 hover:text-white border border-sky-200 hover:border-emerald-500 flex items-center justify-center transition shadow-sm group">
                                    <svg class="w-4 h-4 transition transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.completeSubItem = function(docId, subId, customerName, itemText) {
            showConfirmModal(
                'ยืนยันการเคลียร์รายการสินค้า',
                `ยืนยันว่าจัดส่งรายการ "${itemText}" ของ "${customerName}" เรียบร้อยแล้วใช่หรือไม่?`,
                async () => {
                    try {
                        const docRef = db.collection('deliveries').doc(docId);
                        const docSnap = await docRef.get();
                        if (!docSnap.exists) return;

                        const data = docSnap.data();
                        let currentSubItems = data.subItems || [];
                        
                        const updatedSubItems = currentSubItems.filter(s => s.id !== subId);

                        if (updatedSubItems.length === 0) {
                            await docRef.delete();
                            showToast(`เคลียร์รายการทั้งหมดของ "${customerName}" สำเร็จ`, 'success');
                        } else {
                            await docRef.update({ subItems: updatedSubItems });
                            showToast(`เคลียร์รายการ "${itemText}" สำเร็จ`, 'success');
                        }
                    } catch (err) {
                        console.error(err);
                        showToast('ไม่สามารถอัปเดตข้อมูลได้ กรุณาลองใหม่อีกครั้ง', 'error');
                    }
                }
            );
        };

        window.deleteEntireCustomer = function(docId, name) {
            showConfirmModal(
                'ยืนยันการลบข้อมูลลูกค้า',
                `คุณต้องการลบข้อมูลและรายการทั้งหมดของ "${name}" ออกจากระบบใช่หรือไม่?`,
                async () => {
                    try {
                        await db.collection('deliveries').doc(docId).delete();
                        showToast(`ลบข้อมูลของ "${name}" สำเร็จ`, 'success');
                    } catch (err) {
                        console.error(err);
                        showToast('ไม่สามารถลบข้อมูลได้', 'error');
                    }
                }
            );
        };

        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = allDeliveries.filter(item => 
                (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                (item.companyName && item.companyName.toLowerCase().includes(keyword)) ||
                (item.subItems && item.subItems.some(sub => sub.text.toLowerCase().includes(keyword)))
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
