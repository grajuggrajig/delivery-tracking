<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Delivery Tracking & CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
	
    <style>
        body { font-family: Arial, "Noto Sans Thai", sans-serif; }
        .glass { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    </style>
	
	
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-indigo-100 text-slate-800 flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="bg-white/90 glass border border-white rounded-[2rem] shadow-2xl shadow-sky-200/50 overflow-hidden">
        <div class="bg-gradient-to-r from-sky-600 via-blue-600 to-indigo-600 px-6 py-7 text-white">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-white/15 flex items-center justify-center text-2xl border border-white/20">📦</div>
                <div>
                    <h1 class="text-xl font-bold">Delivery Tracking & CRM</h1>
                    <p class="text-sm text-white/75 mt-1">เข้าสู่ระบบเพื่อใช้งานระบบ</p>
                </div>
            </div>
        </div>

        <form id="login-form" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">📧 อีเมล</label>
                <input id="email" type="email" autocomplete="username" required
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 border border-sky-200 bg-sky-50/40 rounded-2xl outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400 focus:bg-white transition">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-sm font-bold text-slate-700">🔐 รหัสผ่าน</label>
                    <button type="button" id="forgot-password"
                        class="text-xs font-semibold text-sky-600 hover:text-sky-800">
                        ลืมรหัสผ่าน?
                    </button>
                </div>
                <div class="relative">
                    <input id="password" type="password" autocomplete="current-password" required
                        placeholder="กรอกรหัสผ่าน"
                        class="w-full px-4 py-3 pr-12 border border-sky-200 bg-sky-50/40 rounded-2xl outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400 focus:bg-white transition">
                    <button type="button" id="toggle-password"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm">👁️</button>
                </div>
            </div>

            <div id="login-message" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

            <button id="login-btn" type="submit"
                class="w-full py-3.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white rounded-2xl font-bold shadow-lg shadow-sky-200 transition disabled:opacity-60 disabled:cursor-not-allowed">
                🔓 เข้าสู่ระบบ
            </button>

            <a href="index.html"
               class="block text-center text-xs text-slate-400 hover:text-sky-600 transition">
                ← กลับหน้าหลัก
            </a>
        </form>

        <div class="px-6 pb-6 text-center">
            <p class="text-[11px] text-slate-400">ระบบรักษาความปลอดภัยด้วย Firebase Authentication</p>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBAQ347hnwb3a30u0ckyHK1QWV9eUEMiWE",
    authDomain: "delivery-tracking-2313a.firebaseapp.com",
    projectId: "delivery-tracking-2313a",
    storageBucket: "delivery-tracking-2313a.firebasestorage.app",
    messagingSenderId: "631670801383",
    appId: "1:631670801383:web:e720570af97bad7011f342",
    measurementId: "G-BB2D5DJH3F"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ให้สถานะการเข้าสู่ระบบใช้งานร่วมกันระหว่างหน้า Login และหน้า CRM
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(error) {
    console.warn('ตั้งค่าการจดจำการเข้าสู่ระบบไม่สำเร็จ:', error);
});

const form = document.getElementById('login-form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const loginBtn = document.getElementById('login-btn');
const message = document.getElementById('login-message');

function showMessage(text, type = 'error') {
    message.textContent = text;
    message.className = 'rounded-2xl px-4 py-3 text-sm ' +
        (type === 'success'
            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
            : 'bg-rose-50 text-rose-700 border border-rose-200');
}

function friendlyError(code) {
    const map = {
        'auth/invalid-email': 'รูปแบบอีเมลไม่ถูกต้อง',
        'auth/user-not-found': 'ไม่พบผู้ใช้งานอีเมลนี้',
        'auth/wrong-password': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
        'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
        'auth/too-many-requests': 'มีการลองเข้าสู่ระบบหลายครั้ง กรุณารอสักครู่',
        'auth/user-disabled': 'บัญชีนี้ถูกปิดการใช้งาน',
        'auth/network-request-failed': 'ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้'
    };
    return map[code] || 'ไม่สามารถเข้าสู่ระบบได้ กรุณาตรวจสอบข้อมูลแล้วลองใหม่อีกครั้ง';
}

auth.onAuthStateChanged(function(user) {
    if (user) {
        window.location.replace('index.html');
    }
});

form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const mail = email.value.trim();
    const pass = password.value;

    if (!mail || !pass) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';
    message.classList.add('hidden');

    try {
        await auth.signInWithEmailAndPassword(mail, pass);
        showMessage('เข้าสู่ระบบสำเร็จ กำลังเปิดระบบ...', 'success');
        message.classList.remove('hidden');
        setTimeout(() => {
            window.location.replace('index.html');
        }, 350);
    } catch (error) {
        showMessage(friendlyError(error.code));
        message.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = '🔓 เข้าสู่ระบบ';
    }
});

document.getElementById('toggle-password').addEventListener('click', function() {
    const isPassword = password.type === 'password';
    password.type = isPassword ? 'text' : 'password';
    this.textContent = isPassword ? '🙈' : '👁️';
});

document.getElementById('forgot-password').addEventListener('click', async function() {
    const mail = email.value.trim();
    if (!mail) {
        showMessage('กรุณากรอกอีเมลก่อนกด “ลืมรหัสผ่าน”');
        message.classList.remove('hidden');
        email.focus();
        return;
    }

    try {
        await auth.sendPasswordResetEmail(mail);
        showMessage('ส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปยังอีเมลแล้ว', 'success');
        message.classList.remove('hidden');
    } catch (error) {
        showMessage(friendlyError(error.code));
        message.classList.remove('hidden');
    }
});
</script>
</body>
</html>
