<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบเสนอราคา - บริษัท เค แอล สเตชั่นเนอรี่ จำกัด</title>
    <!-- Google Fonts: Sarabun & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #e0e7ff;
            --secondary-color: #1e293b;
            --border-color: #cbd5e1;
            --bg-light: #f8fafc;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --shadow-subtle: 0 10px 30px -5px rgba(79, 70, 229, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --radius-box: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
            color: var(--secondary-color);
            margin: 0;
            padding: 30px 15px 60px 15px;
            font-size: 13px;
            line-height: 1.5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Toast Notification Styling */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-notification {
            background: #ffffff;
            color: var(--secondary-color);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            border-left: 5px solid var(--success-color);
            animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.3s ease 2.7s forwards;
            max-width: 350px;
        }

        .toast-notification.error {
            border-left-color: var(--danger-color);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Sticky Action Toolbar (No Print) */
        .toolbar {
            position: sticky;
            top: 20px;
            z-index: 1000;
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: var(--radius-box);
            box-shadow: 0 15px 35px -5px rgba(79, 70, 229, 0.12), 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .toolbar-title {
            font-weight: 700; 
            color: var(--primary-color); 
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
            filter: brightness(1.05);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        /* Container & Page Layout for Print */
        .page-sheet {
            max-width: 900px;
            margin: 0 auto 35px auto;
            background: #ffffff;
            padding: 40px;
            box-shadow: var(--shadow-subtle);
            border-radius: var(--radius-box);
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Header Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 18px;
        }

        .header-left {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .logo-container img {
            width: 75px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .shop-info-box .company-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .shop-info-box .address-text, 
        .shop-info-box .tax-text {
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
        }

        .title-box {
            text-align: right;
        }

        .title-main {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .title-sub {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* Top Info Grid */
        .top-info {
            width: 100%;
            margin-bottom: 18px;
            border-collapse: collapse;
        }

        .top-info td {
            vertical-align: top;
            padding: 6px;
        }
		/* 📌 ปรับสัดส่วนให้ฝั่งซ้ายกว้างขึ้นเพื่อรองรับที่อยู่ยาวๆ */
        .top-info td:first-child {
            width: 55% !important;
        }
        .top-info td:last-child {
            width: 45% !important;
        }
		/* ขยายความกว้างและปรับขนาดตัวอักษรช่องเลขที่ (No.) ให้พอดีไม่ถูกตัด */
.no-date-box .info-row input[data-field="billNo"] {
    font-size: 11.5px !important;
    letter-spacing: -0.3px;
}
        .customer-info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 10px !important;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }
.no-date-box .info-row input[data-field="billNo"] {
    font-size: 11px !important;
    letter-spacing: -0.5px; /* ลดช่องไฟระหว่างตัวอักษรเล็กน้อย */
}
        .no-date-box {
            background-color: var(--primary-light);
            border: 1px solid #c7d2fe;
            padding: 14px;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(79, 70, 229, 0.02);
        }
		/* ตรวจสอบให้แน่ใจว่า .customer-info-box และช่อง textarea ด้านในมีคุณสมบัตินี้ครับ */
.customer-info-box .inline-textarea {
    width: 100%;
    box-sizing: border-box; /* ป้องกันไม่ให้ padding ดันให้กล่องกว้างเกิน 100% */
    word-break: break-word !important;
    overflow-wrap: break-word !important;
    white-space: pre-wrap !important;
}
        .info-row {
            margin-bottom: 4px;
            display: flex;
            align-items: baseline;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            min-width: 110px;
            font-size: 11.5px;
        }

        .inline-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            outline: none;
            font-family: inherit;
            font-size: inherit;
            padding: 3px 6px;
            color: var(--secondary-color);
            background: transparent;
            transition: all 0.25s ease;
        }

        .inline-input:focus {
            border-bottom: 1.5px solid var(--primary-color);
            background-color: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.08);
        }

/* 📌 แก้ไข CSS ของ .inline-textarea ให้รองรับการขยายความสูงอัตโนมัติ */
.inline-textarea {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    outline: none;
    font-family: inherit;
    font-size: inherit;
    padding: 3px 6px;
    resize: none; /* ปิดการลากขยายมุมขวาล่าง */
    width: 100%;
    background: #fff;
    transition: all 0.25s ease;
    
    /* 🛑 [จุดที่ต้องแก้] ลบ height: 45px; และ overflow: hidden; ออก */
    /* height: 45px; */
    /* overflow: hidden; */
    
    /* ✅ [จุดที่ต้องเพิ่ม] เพิ่ม min-height เพื่อให้มีพื้นที่ขั้นต่ำ */
    min-height: 28px; 
    
    /* ✅ [จุดที่ต้องเพิ่ม] บังคับให้ขยายความสูงอัตโนมัติเมื่อข้อความเยอะขึ้น */
    height: auto; 
    
    /* ✅ [จุดที่ต้องเพิ่ม] ซ่อน scrollbar ตลอดเวลา */
    overflow-y: hidden; 
	/* ✅ เพิ่มคำสั่งบังคับตัดคำป้องกันข้อความล้น */
    word-break: break-word !important;
    overflow-wrap: break-word !important;
    white-space: pre-wrap !important;
}

/* 📌 ปรับ CSS ตอนพิมพ์ให้สอดคล้องกัน */
@media print {
    .inline-textarea {
        /* ✅ ซ่อน border ตอนพิมพ์ (ถ้าต้องการให้ดูเนียนเหมือนกระดาษ) */
        border: none !important; 
        padding: 2px 4px !important;
        /* ✅ ให้ความสูงอัตโนมัติตอนพิมพ์ด้วย */
        height: auto !important; 
    }
}

/* 📌 เฉพาะช่องที่อยู่ลูกค้า: ให้ใช้ความสูงที่ JS คำนวณไว้ตอนพิมพ์ */
@media print {
    .inline-textarea[data-field="custAddress"] {
        min-height: 22px !important;
        overflow: visible !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
        overflow-wrap: anywhere !important;
    }
}

        /* Table Styling */
        .table-responsive-wrapper {
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
			vertical-align: middle !important;
        }

        .data-table th {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #334155;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .item-desc {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 22px;
            height: 22px;
            box-sizing: border-box;
            border: none;
            outline: none;
            resize: none;
            margin: 0;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: 1.4;
            background: transparent;
            overflow: hidden;
            white-space: pre-wrap !important;
            word-break: normal !important;
            overflow-wrap: anywhere !important;
        }

        /* ให้รายการสั้นอยู่กึ่งกลางแนวตั้งของแถวจริง
           และให้รายการยาวขยายตามความสูงของข้อความ */
        .item-row > td:nth-child(2) {
            vertical-align: middle !important;
            overflow: visible;
        }

        @media print {
            .data-table th, .data-table td {
                border: 1px solid var(--border-color);
                padding: 2px 5px !important;
                vertical-align: middle !important;
            }

            /* ไม่บังคับ height:auto เพราะจะทับความสูงที่ JS คำนวณไว้ */
            .item-desc {
                min-height: 22px !important;
                border: none !important;
                background: transparent !important;
                display: block !important;
                overflow: hidden !important;
                white-space: pre-wrap !important;
                word-break: normal !important;
                overflow-wrap: anywhere !important;
            }
        }

        .sku-input, .qty, .price, .unit-input {
            width: 100%;
            border: none;
            outline: none;
            text-align: inherit;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
        }

        .qty, .price {
            text-align: right !important;
        }

        .sku-input, .unit-input {
            text-align: center !important;
        }

        .btn-del {
            background-color: #fee2e2;
            color: var(--danger-color);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-del:hover {
            background-color: var(--danger-color);
            color: white;
            transform: scale(1.05);
        }

        /* Footer & Summary Table */
        .footer-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .footer-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
        }

        .footer-total-label {
            background-color: var(--bg-light);
            font-weight: 600;
            color: #475569;
        }

        /* Signature Section */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 25px;
            page-break-inside: avoid;
        }

        .sig-box {
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 18px 15px;
            border-radius: 12px;
            background-color: #f8fafc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .sig-line {
            border-bottom: 1.5px dotted #94a3b8;
            margin: 35px 15px 10px 15px;
        }

        .sig-name-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 90%;
            outline: none;
            font-family: inherit;
            margin-bottom: 6px;
            font-size: 12px;
            padding-bottom: 2px;
        }

        .sig-text {
            font-size: 12px;
            color: #334155;
            font-weight: 700;
        }

        .sig-date {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
        }

        .sig-date-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 110px;
            outline: none;
            font-family: inherit;
        }

        /* Dynamic Pages Container for Print Pagination */
        #print-pages-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Print Settings */
        @media print {
            @page {
                size: A4;
                margin: 5mm; /* ลดขอบกระดาษสำหรับการพิมพ์ */
            }
            body {
                background-color: #ffffff;
                padding: 0;
                font-size: 11px; /* ลดขนาดฟอนต์ลงเล็กน้อยเพื่อให้พอดีหน้า */
                line-height: 1.3;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .toolbar, .no-print, #toast-container {
                display: none !important;
            }
            .page-sheet {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 auto !important;
                background: #ffffff;
                padding: 8px 14px !important; /* ลด padding ด้านใน */
                box-shadow: none !important;
                border-radius: 0 !important;
                border: none !important;
                page-break-after: always;
            }
            .header-section {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                border-bottom: 1.5px solid #f1f5f9;
                padding-bottom: 4px;
                margin-bottom: 4px;
            }
            .logo-container img {
                width: 55px !important; /* ย่อขนาดโลโก้ลงตอนพิมพ์ */
            }
            .shop-info-box .company-name {
                font-size: 13px;
            }
            .shop-info-box .address-text, .shop-info-box .tax-text {
                font-size: 10px;
            }
            .title-main {
                font-size: 18px;
            }
            .top-info {
                width: 100%;
                margin-bottom: 6px;
                border-collapse: collapse;
            }
            .customer-info-box, .no-date-box {
                padding: 6px 8px !important;
                border-radius: 8px;
            }
            .info-row {
                margin-bottom: 4px;
            }
            .table-responsive-wrapper {
                margin-bottom: 6px;
                border-radius: 6px;
                border: 1px solid var(--border-color);
            }
            .data-table th, .data-table td {
                border: 1px solid var(--border-color);
                padding: 2px 5px !important; /* บีบช่องตารางให้แคบลงป้องกันล้นหน้า */
                font-size: 11px;
            }
            .footer-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 6px;
            }
            .footer-table td {
                padding: 2px 6px !important;
                font-size: 11px;
            }
            .signature-section {
                display: flex;
                justify-content: space-between;
                margin-top: 8px !important;
                gap: 15px;
                page-break-inside: avoid;
            }
            .sig-box {
                flex: 1;
                text-align: center;
                border: 1px solid var(--border-color);
                padding: 6px 8px !important;
                border-radius: 8px;
                background-color: #f8fafc;
            }
            .sig-line {
                border-bottom: 1.5px dotted #94a3b8;
                margin: 25px 10px 4px 10px !important; /* ลดระยะห่างลายเซ็น */
            }
        }
		
		@media print {
    /* ซ่อน placeholder เฉพาะตอนพิมพ์ */
    .sig-name-input::placeholder,
    .sig-date-input::placeholder {
        color: transparent !important;	
    }
    @media print {
    .inline-input::placeholder {
        color: transparent !important;
    }
}
    /* (ทางเลือกเพิ่มเติม) ปิดกรอบ input ตอนพิมพ์ให้ดูเนียนตาเหมือนกระดาษเอกสาร */
    .sig-name-input,
    .sig-date-input {
        border: none !important;
        background: transparent !important;
        text-align: center;
    }
	input::placeholder,
    textarea::placeholder {
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
    }
}


    </style>
</head>
<body>

<!-- พื้นที่แสดงแจ้งเตือน Toast Notification -->
<div id="toast-container"></div>

<!-- แถบเครื่องมือควบคุมแบบลอยเด่น (Compact Glassmorphic Sticky Toolbar) -->
<style>
  .modern-toolbar {
    position: sticky;
    top: 15px;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px; /* ลด padding ลงเพื่อให้แถบบางและกะทัดรัดขึ้น */
    margin: 10px auto;
    max-width: 90%;
    background: rgba(255, 255, 255, 0.35); /* เพิ่มความโปร่งใสให้มองทะลุผ่านได้มากขึ้น */
    backdrop-filter: blur(12px) saturate(180%); /* ลดความเบลอเล็กน้อยเพื่อให้เห็นฉากหลังชัดขึ้น */
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 99px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); /* ลดเงาให้ดูเบาตา ไม่เกะกะ */
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 10px; /* ลดช่องว่างระหว่างปุ่ม */
  }

  .icon-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px; /* ลดขนาดปุ่มให้เล็กลงกำลังดี (จาก 56px เหลือ 40px) */
    height: 40px;
    border-radius: 50%;
    border: none;
    outline: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.08);
  }

  .icon-btn svg {
    width: 20px; /* ปรับขนาดไอคอนให้พอดีกับปุ่ม */
    height: 20px;

    function updateMeta(field, value) {
        docMeta[field] = value;

    function updateItemData(index, field, value) {
        itemsData[index][field] = value;
        if (field === 'qty' || field === 'price') {

    }

    function addRow() {
        itemsData.push({ desc: "", model: "", qty: 1, unit: "", price: 0.00 });

    function removeRow(index) {
        itemsData.splice(index, 1);
        renderDocument();

    function calculateTotals() {
        let subTotal = 0;

        itemsData.forEach((item) => {
            const qty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;
            const price = parseFloat(String(item.price).replace(/,/g, '')) || 0;
            subTotal += (qty * price);
        });

        let discountRate = parseFloat(docMeta.discountRate);
        let discountAmount = 0;

        if (isNaN(discountRate) || discountRate <= 0) {
            discountRate = 0;
            discountAmount = 0;
        } else {
            discountAmount = (subTotal * discountRate) / 100;
        }

        let netTotal = subTotal - discountAmount;
        if (netTotal < 0) netTotal = 0;

        let vatAmount = netTotal * 0.07;
        let grandTotal = netTotal + vatAmount;
        let thaiTextStr = arabicToThaiText(grandTotal);

        const pageSheets = document.querySelectorAll(".page-sheet");
        const totalPages = pageSheets.length;

        pageSheets.forEach((sheet) => {
            const isLast = sheet.getAttribute("data-is-last") === "true";

            const displaySubTotal = (totalPages === 1 || isLast) ? subTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayDiscount = (totalPages === 1 || isLast) ? discountAmount.toFixed(2) : "0.00";
            const displayNetTotal = (totalPages === 1 || isLast) ? netTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayVat     = (totalPages === 1 || isLast) ? vatAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayGrand   = (totalPages === 1 || isLast) ? grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
            const displayThaiText = (totalPages === 1 || isLast) ? thaiTextStr : "ศูนย์บาทถ้วน";

            const subTotalEl = sheet.querySelector(".subTotal");
            const discountRateEl = sheet.querySelector(".discountRate");
            const discountAmountEl = sheet.querySelector(".discountAmount");
            const netTotalEl = sheet.querySelector(".netTotal");
            const vatAmountEl = sheet.querySelector(".vatAmount");
            const grandTotalEl = sheet.querySelector(".grandTotal");
            const textAmountEl = sheet.querySelector(".textAmount");

            if (subTotalEl) subTotalEl.textContent = displaySubTotal;
            if (discountRateEl) discountRateEl.value = discountRate;
            if (discountAmountEl) discountAmountEl.value = displayDiscount;
            if (netTotalEl) netTotalEl.textContent = displayNetTotal;
            if (vatAmountEl) vatAmountEl.textContent = displayVat;
            if (grandTotalEl) grandTotalEl.textContent = displayGrand;
            if (textAmountEl) textAmountEl.textContent = displayThaiText;
        });

        const rows = document.querySelectorAll(".item-row");
        rows.forEach((row, idx) => {
            if (itemsData[idx]) {
                const q = parseFloat(String(itemsData[idx].qty).replace(/,/g, '')) || 0;
                const p = parseFloat(String(itemsData[idx].price).replace(/,/g, '')) || 0;
                const amtCell = row.querySelector(".amount");
                if (amtCell) {
                    amtCell.textContent = (q * p).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            }
        });
    }

    function arabicToThaiText(amount) {
        if (amount === 0) return "ศูนย์บาทถ้วน";
        const arabicNumber = amount.toFixed(2);
        const splitNum = arabicNumber.split(".");
        let integerPart = splitNum[0];
        let decimalPart = splitNum[1];

        let thaiText = convertIntegerToThai(integerPart) + "บาท";
        if (decimalPart === "00") {
            thaiText += "ถ้วน";
        } else {
            thaiText += convertIntegerToThai(decimalPart) + "สตางค์";
        }
        return thaiText;
    }

    function convertIntegerToThai(numStr) {
        const thaiNums = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
        const thaiUnits = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];
        let result = "";
        let len = numStr.length;

        for (let i = 0; i < len; i++) {
            let digit = parseInt(numStr[i]);
            let pos = len - i - 1;

            if (digit !== 0) {
                if (pos === 1 && digit === 1) {
                    result += "สิบ";
                } else if (pos === 1 && digit === 2) {
                    result += "ยี่สิบ";
                } else if (pos === 0 && digit === 1 && len > 1 && parseInt(numStr[len - 2]) !== 0) {
                    result += "เอ็ด";
                } else {
                    result += thaiNums[digit] + thaiUnits[pos % 6];
                }
            }
        }
        return result;
    }

// ฟังก์ชันช่วยแปลงวันที่ให้เป็น YYYY-MM-DD สำหรับ input type="date"
    function formatToInputDate(dateStr) {
        if (!dateStr) return "";
        // ถ้าเป็นรูปแบบ ISO อยู่แล้ว (เช่น 2026-06-05T00:00:00.000Z) ตัดเอาเฉพาะ 10 ตัวแรก
        if (dateStr.includes('T')) {
            return dateStr.split('T')[0];
        }
        // ถ้าเป็นรูปแบบไทยหรือสากลแบบอื่น ลองแปลงด้วย Date object
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            let year = d.getFullYear();
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        return dateStr;
    }

    // อัปเดตค่าลงใน UI input พร้อมแปลง Format ให้ถูกต้อง
    let dateInput = document.querySelector('.meta-field[data-field="billDate"]') || document.getElementById('billDate');
    if (dateInput) {
        dateInput.value = formatToInputDate(docMeta.billDate);
    }

    let sigDateInput = document.querySelector('.meta-field[data-field="sigSalesDate"]') || document.getElementById('sigSalesDate');
    if (sigDateInput) {
        sigDateInput.value = formatToInputDate(docMeta.sigSalesDate);
    }

 function adjustTextareaHeight(ta) {
        if (!ta) return;

        // รีเซ็ตเป็นความสูงขั้นต่ำก่อนคำนวณ เพื่อให้รองรับการลบข้อความด้วย
        ta.style.height = '22px';

        // ใช้ scrollHeight เพื่อให้กล่องขยายครบทุกบรรทัดตามความกว้างจริงของช่อง
        const contentHeight = Math.max(22, ta.scrollHeight);
        ta.style.height = contentHeight + 'px';
    }

    function adjustAllItemDescriptions() {
        document.querySelectorAll('textarea.item-desc').forEach(function(ta) {
            adjustTextareaHeight(ta);
        });
    }

    // 📌 เฉพาะช่อง Address: ขยายตามความยาวจริงของที่อยู่ลูกค้า
    function adjustCustomerAddressHeight() {
        document.querySelectorAll('textarea[data-field="custAddress"]').forEach(function(ta) {
            ta.style.height = 'auto';
            const contentHeight = Math.max(22, ta.scrollHeight);
            ta.style.height = contentHeight + 'px';
        });
    }

    window.addEventListener('load', function() {
        document.querySelectorAll('textarea.item-desc').forEach(function(ta) {
            adjustTextareaHeight(ta);
        });
        adjustCustomerAddressHeight();
    });

    document.addEventListener('input', function(e) {
        if (!e.target) return;

        if (e.target.matches('textarea.item-desc')) {
            adjustTextareaHeight(e.target);
        } else if (e.target.matches('textarea[data-field="custAddress"]')) {
            adjustCustomerAddressHeight();
        } else if (e.target.matches('textarea.inline-textarea, textarea.meta-field')) {
            e.target.style.height = 'auto';
            e.target.style.height = Math.max(22, e.target.scrollHeight) + 'px';
        }
    });

    // เมื่อความกว้างตารางเปลี่ยน ต้องคำนวณใหม่ เพราะจำนวนบรรทัดอาจเปลี่ยน
    window.addEventListener('resize', function() {
        requestAnimationFrame(adjustAllItemDescriptions);
    });

    // คำนวณอีกครั้งก่อนพิมพ์ เพื่อให้หน้าจอและ PDF ใช้ความสูงเดียวกัน
    window.addEventListener('beforeprint', function() {
        adjustAllItemDescriptions();
        adjustCustomerAddressHeight();
        // บังคับใช้ความสูงที่คำนวณแล้วเฉพาะ Address เพื่อไม่ให้ CSS print ย่อกลับ
        document.querySelectorAll('textarea[data-field="custAddress"]').forEach(function(ta) {
            const contentHeight = Math.max(22, ta.scrollHeight);
            ta.style.setProperty('height', contentHeight + 'px', 'important');
        });
    });

    window.addEventListener('afterprint', function() {
        document.querySelectorAll('textarea[data-field="custAddress"]').forEach(function(ta) {
            ta.style.removeProperty('height');
        });
        requestAnimationFrame(function() {
            adjustAllItemDescriptions();
            adjustCustomerAddressHeight();
        });
    });

    // หลัง render รายการใหม่ ให้รอ layout เสร็จก่อนคำนวณความสูง
    const originalRenderDocument = renderDocument;
    renderDocument = function() {
        originalRenderDocument();
        requestAnimationFrame(function() {
            adjustAllItemDescriptions();
            adjustCustomerAddressHeight();
            requestAnimationFrame(function() {
                adjustAllItemDescriptions();
                adjustCustomerAddressHeight();
            });
        });
    };

</script>

</body>
</html>
